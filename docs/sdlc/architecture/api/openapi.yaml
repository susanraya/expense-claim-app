components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    users:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        password_hash:
          type: string
        full_name:
          type: string
        role:
          type: string
        manager_id:
          type: string
          format: uuid
        is_active:
          type: boolean
        privacy_notice_ack_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - password_hash
      - full_name
      - role
      - is_active
      - created_at
    categories:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        limit_amount:
          type: number
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - is_active
      - created_at
    claims:
      type: object
      properties:
        id:
          type: string
          format: uuid
        employee_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        amount:
          type: number
        currency:
          type: string
        expense_date:
          type: string
          format: date
        description:
          type: string
        status:
          type: string
        over_limit_flag:
          type: boolean
        last_rejection_reason:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - employee_id
      - category_id
      - amount
      - currency
      - expense_date
      - status
      - over_limit_flag
      - created_at
      - updated_at
    receipts:
      type: object
      properties:
        id:
          type: string
          format: uuid
        claim_id:
          type: string
          format: uuid
        s3_key:
          type: string
        file_name:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
        uploaded_at:
          type: string
          format: date-time
      required:
      - id
      - claim_id
      - s3_key
      - file_name
      - content_type
      - size_bytes
      - uploaded_at
    claim_audit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        claim_id:
          type: string
          format: uuid
        actor_user_id:
          type: string
          format: uuid
        action:
          type: string
        from_status:
          type: string
        to_status:
          type: string
        comment:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - claim_id
      - actor_user_id
      - action
      - created_at
